[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "prepare-backend"
version = "0.1.0"
description = "Minimal FastAPI development environment"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "build==1.6.1",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prepare_backend"]

[tool.hatch.build.targets.sdist]
include = ["src/prepare_backend", "pyproject.toml"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["dist", ".venv", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "../scripts/verify_wheel.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
